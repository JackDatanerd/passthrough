name: CI

# Make this workflow a REQUIRED status check on `main` (GitHub -> Settings ->
# Branches -> branch protection). Cloudflare deploys from a push/manual
# `wrangler deploy`, so the check only gates anything once it is required.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # --no-save: does not touch package.json / package-lock.json
      - run: npm i --no-save typescript@5
      - name: Undefined identifiers + syntax (would have caught the webhook fix_tier bug)
        run: npm run lint
      # Backend only (vitest.worker.config.mjs): needs nothing beyond the root `npm ci`.
      # `npm test` also runs the React component tests, which need frontend/'s own dependencies.
      - name: Unit tests
        run: npm run test:worker
      # Bundles the Worker exactly as `wrangler deploy` would (no credentials, nothing is
      # uploaded): a missing export (the RateLimiterDO class), a bad binding or an unresolvable
      # require fails here instead of in production.
      - name: Bundle check (wrangler deploy --dry-run)
        run: npm run bundle-check

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # A real Vite build is the only thing that compiles every JSX file.
      - run: npm run build

  frontend-tests:
    name: Frontend — component + logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # The runner (vitest, jsdom, Testing Library) lives in the ROOT package; the SPA's own packages
      # (axios, react-router-dom, ...) live in frontend/. Both are needed.
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      # Two copies of React in one process — the root one the tests render with, and the SPA's own that
      # react-router loads for itself — fail every component rendered under a router with "Cannot read
      # properties of null (reading 'useRef')". Dropping the SPA's copies makes Node resolve the root one.
      - name: Use a single copy of React
        run: rm -rf frontend/node_modules/react frontend/node_modules/react-dom
      - name: Frontend tests
        run: npm run test:frontend
