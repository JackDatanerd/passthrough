name = "passthrough-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── R2: resume uploads + generated files ──────────────────────────────
[[r2_buckets]]
binding     = "RESUMES_BUCKET"
bucket_name = "passthrough-resumes"

# ── KV: rate limiting (best-effort fixed window, see middleware/rateLimiter.js) ──
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id      = "489f1b7c413744efb066df3335bff8c2"

# ── Browser Rendering: replaces local Puppeteer / the entire VPS requirement ──
[browser]
binding = "BROWSER"

# ── Queue: background processing for generateFix/generateBadge — these do
# two Claude calls + a Browser Rendering PDF render (~20-45s), which exceeds
# ctx.waitUntil()'s hard 30s wall-clock cap. Queue consumers have no such
# cap. max_batch_size = 1 because each job is already heavy on its own.
# Run once before first deploy: `wrangler queues create passthrough-fix-jobs`
# and `wrangler queues create passthrough-fix-jobs-dlq`.
[[queues.producers]]
queue   = "passthrough-fix-jobs"
binding = "FIX_QUEUE"

[[queues.consumers]]
queue              = "passthrough-fix-jobs"
max_batch_size     = 1
max_batch_timeout  = 5
max_retries        = 3
dead_letter_queue  = "passthrough-fix-jobs-dlq"

# AUDIT FIX (Section 9, feature gap): the dead_letter_queue above had no
# consumer — a job that exhausted max_retries sat here forever with nothing
# reading it. Consumed by the same `queue` export in index.js (dispatched on
# batch.queue) — see services/deadletter.service.js for what it does with
# each message.
[[queues.consumers]]
queue              = "passthrough-fix-jobs-dlq"
max_batch_size     = 10
max_batch_timeout  = 30

# ── Cron: hourly — drives all seven scheduled jobs in index.js's `scheduled`
#    export (stuck-scan recovery, orphaned-payment sweep, stale-pending sweep,
#    pending-payment/webhook_events maintenance, failed-fix re-queue, lead-match
#    digest, data retention incl. the anonymous-scan purge). One trigger, seven jobs. ──
[triggers]
crons = ["0 * * * *"]

# ── Non-secret config (mirrors backend/config/constants.js + safe env vars) ──
# Secrets (API keys, DB keys, JWT secret, SMTP/Resend key, Paystack key) are
# NEVER placed here — they go through `wrangler secret put` (prod) or
# `.dev.vars` (local, gitignored). See .dev.vars.example for the full list.
[vars]
NODE_ENV               = "production"
FRONTEND_URL            = "https://passthrough.dev"
PAYSTACK_CURRENCY       = "USD"
PAYSTACK_CALLBACK_URL   = "https://passthrough.dev/payment/success"
ANTHROPIC_MODEL         = "claude-sonnet-4-6"
EMAIL_FROM              = "Passthrough <hello@passthrough.dev>"
JWT_EXPIRES_IN_SECONDS  = "604800"   # 7 days, replaces JWT_EXPIRES_IN="7d"
# Critical-failure alert destination (queue job crashes, webhook signature
# mismatches) — see services/email.service.js's sendOwnerAlert. Change this
# if you want alerts going somewhere other than the support inbox.
OWNER_ALERT_EMAIL       = "passthrough672@gmail.com"

# ── Launch promo ──────────────────────────────────────────────────────
# This is the ONLY place the promo countdown/deadline lives. constants.js's
# isPromoActive() reads these two vars, and BOTH the price actually charged
# (initializePayment) and the price/countdown shown to the user (/api/pricing,
# scan/:id/initiate-fix) read the same isPromoActive() — so whatever the
# countdown on the site says is literally what will be enforced at checkout,
# nothing separate to keep in sync.
#
# To end the promo on schedule: do nothing, it lapses automatically at
# PROMO_ENDS_AT and priceForTier() reverts to standard pricing.
# To extend it: change PROMO_ENDS_AT to a later time and redeploy. That's a
# real, visible decision each time — the site will show the new true
# deadline, not a fake one ticking down to a date that was never going to
# matter. Set PROMO_ACTIVE = "false" to kill the promo immediately regardless
# of the date.
PROMO_ACTIVE            = "true"
PROMO_ENDS_AT           = "2026-08-11T23:59:59Z"   # placeholder — set to your real launch-week end time before deploying

# ── Local dev overrides ──────────────────────────────────────────────
# `wrangler dev` reads [vars] above + .dev.vars (gitignored) for secrets.
# For local FRONTEND_URL/callback URLs pointing at localhost, override
# in a separate `wrangler.dev.toml` or just edit [vars] locally before
# running `wrangler dev` — do not commit localhost values to this file.
